# 機器可讀的風格規則。人讀版在 style/guide/（入口 00_README.md，檢查清單 50_檢查/）。
# v1（2026-09-25）：由 style/guide 23 檔的 MUST／NEVER／AVOID 規則裡「有 regex 或計數檢查」的條目重新產生。
#
# 兩個清單：
#   rules:         scripts/style_check.py 與 scripts/check_written.py 直接讀這份（兩支程式只讀 ["rules"]）。
#                  kind：phrase＝字面比對、regex＝Python re、count＝全套字面計數上限（count 的 pattern 是字面字串，不是 regex）。
#                  scope：slide＝標題＋條列＋表格；title＝只看標題；notes＝講稿＋講義補充；all＝slide＋notes。
#                  國考題張（type: quiz）兩支程式都跳過，所以這裡的規則不必再寫國考排除條件。
#   other_checks:  需要張的位置、字級、顏色、XML、素材池原始檔或全套比例才能判斷的檢查；style_check 不讀。
#                  engine 欄寫由誰執行（check_deck.py 第 N 項＝已實作；未實作＝建議加進 check_deck.py 或另寫腳本）。
#                  scope 用位置詞：deck、slide1、slide2、first3、last3、section_end、divider、quiz、title_all、run、xml、pool、credit、notes_body。
#                  kind：regex、count_regex（regex 命中次數的全套上限；rules 的 count 只收字面字串，所以放這裡）、metric（pattern 欄是判準的文字描述）。
#
# 欄位：id、level（RED＝不得交付／WARN＝提醒）、scope、kind、pattern、max（count 用）、message、example_bad、example_ok、evidence；
#       新增欄：guide_id（指南規則 ID）、guide（所在檔）、v0（true＝2026-09-24 v0 的舊條目）、guide_check_level（指南機械檢查欄寫的等級，與 level 不同時才寫）、
#       level_note（level 不照「規則等級」對應的理由）、engine（other_checks 用）。
#
# 等級對應：規則等級 MUST／NEVER → RED；SHOULD／AVOID → WARN。
#   例外 1：MUST／NEVER 規則的機械檢查欄明寫「regex 只當提示、→ WARN」者（TERM-03、TERM-18、TTL-17 等）用 WARN，寫在 level_note。
#   例外 2：AVOID 規則的機械檢查欄寫 FAIL 者（SYM-06、DIV-06、TCM-18 等）仍照規則等級給 WARN，另記 guide_check_level: FAIL；
#           對「從零新寫」的 deck，這些 WARN 交付前要逐條改掉（見 style/guide/50_檢查/52_交付前檢查清單.md）。
#
# id 規則：
#   v0 的 18 條保留原 id 與原內容（只加 v0、guide_id 兩欄）。v0 有 15 個 id 與指南同號不同義（例：v0 的 BAN-07＝戲劇化第二人稱，
#   指南 BAN-07＝口號類比）；指南各檔以「v0:BAN-07」稱呼 v0 條目。
#   新條目用指南 ID；指南 ID 已被 v0 佔用時加「g」（BAN-07g＝指南 BAN-07）。同一條指南規則拆成幾個檢查時，
#   WARN 級的加「w」（BAN-34w），只查投影片的 RED 級加「s」（BAN-35s）；這些條目都有 guide_id 欄。
#   同一個 id 可以同時出現在 rules 與 other_checks（同一條規則的文字面與位置面檢查）；同一清單內 id 唯一。
#   v0 條目與新條目的命中會重疊（例：「打這裡」同時報 BAN-05 RED 與 BAN-05g WARN），v0 保留是為了不放寬既有 RED。
#
# v0 → 指南 canonical id（依 20_文字/23_禁用語與LLM語.md S13、20_文字/21_標題句式.md）：
#   SYM-01→SYM-01｜SYM-02→SYM-04｜TERM-01→TERM-02｜TERM-02→TERM-04｜BAN-01、BAN-02→BAN-03｜BAN-03→BAN-03、BAN-19｜BAN-04→BAN-03、BAN-19
